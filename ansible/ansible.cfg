[defaults]
# No inventory here: the deploy repo (postmodern-you/postmodern-deploy) is the
# inventory of record; fleet.sh takes it via FLEET_INVENTORY.
roles_path = roles
host_key_checking = False
# Use the built-in default callback with YAML-formatted results (the
# community.general.yaml stdout callback is deprecated).
callback_result_format = yaml
nocows = True
# Inventory plugins: yaml for the deploy repo's rendered inventory; host_list
# keeps `-i 'localhost,'`.
enable_plugins = host_list, yaml, ini

[ssh_connection]
pipelining = True

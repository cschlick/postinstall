[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
# Use the built-in default callback with YAML-formatted results (the
# community.general.yaml stdout callback is deprecated).
callback_result_format = yaml
nocows = True
# Inventory plugins: yaml for inventory/hosts.yml; host_list keeps `-i 'localhost,'`.
enable_plugins = host_list, yaml, ini

[ssh_connection]
pipelining = True

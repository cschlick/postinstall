[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
# Use the built-in default callback with YAML-formatted results (the
# community.general.yaml stdout callback is deprecated).
callback_result_format = yaml
nocows = True
# Inventory plugins to enable: `auto` loads any plugin named in a file's
# `plugin:` key (incl. inventory/vultr.yml); host_list keeps `-i 'localhost,'`.
enable_plugins = auto, host_list, yaml, ini, vultr.cloud.vultr

[ssh_connection]
pipelining = True

---
# Assert the profile-differentiating end state. The firewall is asserted on
# the RENDERED /etc/nftables.conf (nftables_apply is false in containers);
# it was already syntax-validated by the role's `nft -c` on deploy.
- name: Verify (all profiles)
  hosts: all
  become: true
  tasks:
    - name: Read passwd, shadow, nftables.conf, sshd_config, sudoers grant
      ansible.builtin.slurp:
        path: "{{ item }}"
      loop:
        - /etc/passwd
        - /etc/shadow
        - /etc/nftables.conf
        - /etc/ssh/sshd_config
        - /etc/sudoers.d/pmuser-nopasswd
      register: verify_files

    - name: Decode file contents
      ansible.builtin.set_fact:
        v_passwd: "{{ verify_files.results[0].content | b64decode }}"
        v_shadow: "{{ verify_files.results[1].content | b64decode }}"
        v_nft: "{{ verify_files.results[2].content | b64decode }}"
        v_sshd: "{{ verify_files.results[3].content | b64decode }}"
        v_sudoers: "{{ verify_files.results[4].content | b64decode }}"

    - name: Assert invariants shared by every profile
      ansible.builtin.assert:
        quiet: true
        that:
          - "'pmuser:' in v_passwd"
          - "'root:!:' in v_shadow"
          - 'v_sudoers == "pmuser ALL=(ALL) NOPASSWD: /usr/local/bin/gw\n"'
          - "'iifname \"gw-*\" tcp dport 22 ct state new accept' in v_nft"
          # gw-door is dispatched (51903 accept, then drop) BEFORE any gw-*
          # rule, so the glob accepts can never apply to the enrollment iface.
          - "'iifname \"gw-door\" drop' in v_nft"
          - v_nft.index('iifname "gw-door" drop') < v_nft.index('iifname "gw-*"')
          - "'AllowUsers pmuser' in v_sshd"
          - "'PermitRootLogin no' in v_sshd"

- name: Verify bastion profile
  hosts: bastion
  become: true
  tasks:
    - name: Assert bastion end state
      ansible.builtin.assert:
        quiet: true
        that:
          # Public SSH: IPv6 yes, IPv4 no.
          - "'ip6 saddr ::/0 tcp dport 22 ct state new accept' in v_nft"
          - "'ip saddr 0.0.0.0/0' not in v_nft"
          # Key-only, ProxyJump served, IPv6-only listener.
          - "'PasswordAuthentication no' in v_sshd"
          - "'AllowTcpForwarding local' in v_sshd"
          - "'PermitOpen *:' in v_sshd"
          - "'AddressFamily inet6' in v_sshd"
          # Image-residue accounts purged.
          - "'linuxuser:' not in v_passwd"
          - "'\nuser:' not in v_passwd"
          # No mesh service ports on a plain gw_node.
          - "'dport 4222' not in v_nft"

- name: Verify dev profile
  hosts: dev
  become: true
  tasks:
    - name: Assert dev end state
      ansible.builtin.assert:
        quiet: true
        that:
          # Public SSH over BOTH families.
          - "'ip6 saddr ::/0 tcp dport 22 ct state new accept' in v_nft"
          - "'ip saddr 0.0.0.0/0 tcp dport 22 ct state new accept' in v_nft"
          # Password SSH on, IPv4 listener, ProxyJump served.
          - "'PasswordAuthentication yes' in v_sshd"
          - "'AddressFamily any' in v_sshd"
          - "'ListenAddress 0.0.0.0' in v_sshd"
          - "'AllowTcpForwarding local' in v_sshd"
          # NO purging on dev.
          - "'linuxuser:' in v_passwd"
          - "'\nuser:' in v_passwd"

    - name: Stat the Claude Code install
      ansible.builtin.stat:
        path: /usr/local/bin/claude
      register: verify_claude

    - name: Assert Claude Code is installed and linked
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_claude.stat.islnk
          - verify_claude.stat.lnk_target == '/home/pmuser/.local/bin/claude'

- name: Verify gw_node profile
  hosts: gw_node:!nats
  become: true
  tasks:
    - name: Assert gw_node end state
      ansible.builtin.assert:
        quiet: true
        that:
          # NO public SSH at all — the overlay rule (asserted for all) is the
          # only way in.
          - "'ip6 saddr ::/0 tcp dport 22' not in v_nft"
          - "'ip saddr 0.0.0.0/0' not in v_nft"
          # Fully locked down sshd.
          - "'DisableForwarding yes' in v_sshd"
          - "'AllowTcpForwarding no' in v_sshd"
          - "'PasswordAuthentication no' in v_sshd"
          # Image-residue accounts purged.
          - "'linuxuser:' not in v_passwd"
          - "'\nuser:' not in v_passwd"

- name: Verify nats profile (stacked on gw_node)
  hosts: nats
  become: true
  tasks:
    - name: Assert stacked end state (gw_node lockdown + nats mesh ports)
      ansible.builtin.assert:
        quiet: true
        that:
          # Base gw_node behaviour intact.
          - "'ip6 saddr ::/0 tcp dport 22' not in v_nft"
          - "'DisableForwarding yes' in v_sshd"
          # NATS ports opened on the overlay interface ONLY.
          - "'iifname \"gw-*\" tcp dport 4222 ct state new accept' in v_nft"
          - "'iifname \"gw-*\" tcp dport 8222 ct state new accept' in v_nft"
          - "'dport 4222 ct state new accept' not in (v_nft | replace('iifname \"gw-*\" tcp dport 4222 ct state new accept', ''))"

    - name: Read nats-server.conf
      ansible.builtin.slurp:
        path: /etc/nats-server.conf
      register: verify_nats_conf

    - name: Assert NATS config (non-loopback bind, JetStream, mutual TLS)
      ansible.builtin.assert:
        quiet: true
        that:
          - "('host: \"' ~ nats_listen_addr ~ '\"') in c"
          - "'store_dir: \"/var/lib/nats-server/jetstream\"' in c"
          - "'verify:    true' in c"
      vars:
        c: "{{ verify_nats_conf.content | b64decode }}"

    # --- EXTERNAL mTLS check: run from a DIFFERENT container. Under bridge
    # networking (CI) this crosses network namespaces — a genuinely external
    # client. The checker proves: banner advertises mTLS+JetStream, a
    # certless client is rejected, a CA-signed client gets CONNECT/PING->PONG.
    - name: Read the client credentials off the nats host
      ansible.builtin.slurp:
        path: "/etc/nats/tls/{{ item }}"
      loop: [ca.crt, client.crt, client.key]
      register: verify_nats_creds

    - name: Place the client credentials on the external tester
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "/tmp/nats-check-{{ item.item }}"
        mode: "0600"
      loop: "{{ verify_nats_creds.results }}"
      loop_control:
        label: "{{ item.item }}"
      delegate_to: profiles-gw-node

    - name: Install the mTLS checker on the external tester
      ansible.builtin.copy:
        src: ../../roles/nats/molecule/default/files/nats_mtls_check.py
        dest: /tmp/nats_mtls_check.py
        mode: "0755"
      delegate_to: profiles-gw-node

    - name: Run the external mTLS checks against this nats host
      ansible.builtin.command: >-
        python3 /tmp/nats_mtls_check.py {{ nats_listen_addr }} {{ nats_port }}
        /tmp/nats-check-ca.crt /tmp/nats-check-client.crt /tmp/nats-check-client.key
      changed_when: false
      delegate_to: profiles-gw-node

# Standalone postgres only. The merged account host is also in the postgres
# group but reaches its DB over the LOCAL socket (checked in the account play),
# so it skips the external mTLS check — which also avoids two postgres hosts
# racing on the shared tester's fixed /tmp/pg-check-* cert paths.
- name: Verify postgres profile (stacked on gw_node)
  hosts: postgres:!account
  become: true
  tasks:
    - name: Assert stacked end state (gw_node lockdown + postgres mesh port)
      ansible.builtin.assert:
        quiet: true
        that:
          # Base gw_node behaviour intact.
          - "'ip6 saddr ::/0 tcp dport 22' not in v_nft"
          - "'DisableForwarding yes' in v_sshd"
          # Postgres port opened on the overlay interface ONLY.
          - "'iifname \"gw-*\" tcp dport 5432 ct state new accept' in v_nft"
          - "'dport 5432 ct state new accept' not in (v_nft | replace('iifname \"gw-*\" tcp dport 5432 ct state new accept', ''))"

    - name: Read the postgres config drop-in and pg_hba
      ansible.builtin.slurp:
        path: "{{ item }}"
      loop:
        - /etc/postgresql/17/main/conf.d/99-mesh.conf
        - /etc/postgresql/17/main/pg_hba.conf
      register: verify_pg_conf

    - name: Assert postgres config (non-loopback bind, TLS on, mTLS-only hba)
      ansible.builtin.assert:
        quiet: true
        that:
          - "(\"listen_addresses = '\" ~ postgres_listen_addr ~ \"'\") in conf"
          - "'ssl = on' in conf"
          - "'clientcert=verify-ca' in hba"
          - "'\nhost ' not in hba"
      vars:
        conf: "{{ verify_pg_conf.results[0].content | b64decode }}"
        hba: "{{ verify_pg_conf.results[1].content | b64decode }}"

    # --- EXTERNAL mTLS check from a different container (see the nats play).
    - name: Read the client credentials off the postgres host
      ansible.builtin.slurp:
        path: "/etc/postgres/tls/{{ item }}"
      loop: [root.crt, client.crt, client.key]
      register: verify_pg_creds

    - name: Place the client credentials on the external tester
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "/tmp/pg-check-{{ item.item }}"
        mode: "0600"
      loop: "{{ verify_pg_creds.results }}"
      loop_control:
        label: "{{ item.item }}"
      delegate_to: profiles-gw-node

    - name: Install psql and the mTLS checker on the external tester
      ansible.builtin.apt:
        name: postgresql-client
        state: present
        update_cache: true
      delegate_to: profiles-gw-node

    - name: Install the mTLS checker on the external tester
      ansible.builtin.copy:
        src: ../../roles/postgres/molecule/default/files/pg_mtls_check.sh
        dest: /tmp/pg_mtls_check.sh
        mode: "0755"
      delegate_to: profiles-gw-node

    - name: Run the external mTLS checks against this postgres host
      ansible.builtin.command: >-
        bash /tmp/pg_mtls_check.sh {{ postgres_listen_addr }} {{ postgres_port }}
        /tmp/pg-check-root.crt /tmp/pg-check-client.crt /tmp/pg-check-client.key
      changed_when: false
      delegate_to: profiles-gw-node

- name: Verify account profile (stacked on gw_node)
  hosts: account
  become: true
  tasks:
    - name: Assert stacked end state (gw_node lockdown + public :18766 rule)
      ansible.builtin.assert:
        quiet: true
        that:
          # Base gw_node behaviour intact.
          - "'ip6 saddr ::/0 tcp dport 22' not in v_nft"
          - "'DisableForwarding yes' in v_sshd"
          # The account server is CLIENT-FACING: its port is public (no iifname),
          # unlike the mesh-only nats/postgres ports.
          - "'tcp dport 18766 ct state new accept' in v_nft"

    - name: Assert account.service is active (quadlet -> systemd -> podman)
      ansible.builtin.command: systemctl is-active account.service
      register: verify_acct_active
      changed_when: false
      failed_when: verify_acct_active.stdout != "active"

    # --- LOCAL DB: the whole point of the merge. Prove the account app's uid
    # (pm) can reach the co-located postgres over the Unix socket with peer
    # auth — no password, no TLS. This is the exact path the container (uid
    # 10001 = pm) uses; running it as the host pm user faithfully mirrors it.
    - name: Read the rendered env + quadlet
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: verify_acct_files
      loop:
        - /etc/postmodern/account.env
        - /etc/containers/systemd/account.container

    - name: Assert the DSN is the local socket and the socket is mounted
      vars:
        env: "{{ verify_acct_files.results[0].content | b64decode }}"
        quadlet: "{{ verify_acct_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - "'ACCOUNT_DB_URL=postgresql://pm@/account?host=/run/postgresql' in env"
          - "'Volume=/run/postgresql:/run/postgresql:ro' in quadlet"

    # sudo -u pm (not become_user: pm — pm's nologin shell breaks ansible become);
    # this runs as uid 10001 exactly like the container does.
    - name: SELECT 1 over the socket as pm (peer auth, no password/TLS)
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - pm
          - psql
          - host=/run/postgresql dbname=account
          - -tAc
          - SELECT 1
      register: verify_local_db
      changed_when: false
      failed_when: verify_local_db.stdout != "1"

    # --- EXTERNAL reachability: hit /healthz from a DIFFERENT container. Under
    # bridge networking (CI) this crosses network namespaces — a real external
    # client reaching the host-net-bound container port.
    - name: Hit /healthz from the external tester
      ansible.builtin.uri:
        url: "http://{{ ansible_facts.default_ipv4.address }}:18766/healthz"
        status_code: 200
      changed_when: false
      delegate_to: profiles-gw-node

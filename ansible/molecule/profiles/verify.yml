---
# Assert the profile-differentiating end state. The firewall is asserted on
# the RENDERED /etc/nftables.conf (nftables_apply is false in containers);
# it was already syntax-validated by the role's `nft -c` on deploy.
- name: Verify (all profiles)
  hosts: all
  become: true
  tasks:
    - name: Read passwd, shadow, nftables.conf, sshd_config, sudoers grant
      ansible.builtin.slurp:
        path: "{{ item }}"
      loop:
        - /etc/passwd
        - /etc/shadow
        - /etc/nftables.conf
        - /etc/ssh/sshd_config
        - /etc/sudoers.d/pmuser-nopasswd
      register: verify_files

    - name: Decode file contents
      ansible.builtin.set_fact:
        v_passwd: "{{ verify_files.results[0].content | b64decode }}"
        v_shadow: "{{ verify_files.results[1].content | b64decode }}"
        v_nft: "{{ verify_files.results[2].content | b64decode }}"
        v_sshd: "{{ verify_files.results[3].content | b64decode }}"
        v_sudoers: "{{ verify_files.results[4].content | b64decode }}"

    - name: Assert invariants shared by every profile
      ansible.builtin.assert:
        quiet: true
        that:
          - "'pmuser:' in v_passwd"
          - "'root:!:' in v_shadow"
          - 'v_sudoers == "pmuser ALL=(ALL) NOPASSWD: /usr/local/bin/gw\n"'
          - "'iifname \"gw-pm\" tcp dport 22 ct state new accept' in v_nft"
          - "'AllowUsers pmuser' in v_sshd"
          - "'PermitRootLogin no' in v_sshd"

- name: Verify bastion profile
  hosts: bastion
  become: true
  tasks:
    - name: Assert bastion end state
      ansible.builtin.assert:
        quiet: true
        that:
          # Public SSH: IPv6 yes, IPv4 no.
          - "'ip6 saddr ::/0 tcp dport 22 ct state new accept' in v_nft"
          - "'ip saddr 0.0.0.0/0' not in v_nft"
          # Key-only, ProxyJump served, IPv6-only listener.
          - "'PasswordAuthentication no' in v_sshd"
          - "'AllowTcpForwarding local' in v_sshd"
          - "'PermitOpen *:' in v_sshd"
          - "'AddressFamily inet6' in v_sshd"
          # Image-residue accounts purged.
          - "'linuxuser:' not in v_passwd"
          - "'\nuser:' not in v_passwd"
          # No mesh service ports on a plain gw_node.
          - "'dport 4222' not in v_nft"

- name: Verify dev profile
  hosts: dev
  become: true
  tasks:
    - name: Assert dev end state
      ansible.builtin.assert:
        quiet: true
        that:
          # Public SSH over BOTH families.
          - "'ip6 saddr ::/0 tcp dport 22 ct state new accept' in v_nft"
          - "'ip saddr 0.0.0.0/0 tcp dport 22 ct state new accept' in v_nft"
          # Password SSH on, IPv4 listener, ProxyJump served.
          - "'PasswordAuthentication yes' in v_sshd"
          - "'AddressFamily any' in v_sshd"
          - "'ListenAddress 0.0.0.0' in v_sshd"
          - "'AllowTcpForwarding local' in v_sshd"
          # NO purging on dev.
          - "'linuxuser:' in v_passwd"
          - "'\nuser:' in v_passwd"

    - name: Stat the Claude Code install
      ansible.builtin.stat:
        path: /usr/local/bin/claude
      register: verify_claude

    - name: Assert Claude Code is installed and linked
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_claude.stat.islnk
          - verify_claude.stat.lnk_target == '/home/pmuser/.local/bin/claude'

- name: Verify gw_node profile
  hosts: gw_node:!nats
  become: true
  tasks:
    - name: Assert gw_node end state
      ansible.builtin.assert:
        quiet: true
        that:
          # NO public SSH at all — the overlay rule (asserted for all) is the
          # only way in.
          - "'ip6 saddr ::/0 tcp dport 22' not in v_nft"
          - "'ip saddr 0.0.0.0/0' not in v_nft"
          # Fully locked down sshd.
          - "'DisableForwarding yes' in v_sshd"
          - "'AllowTcpForwarding no' in v_sshd"
          - "'PasswordAuthentication no' in v_sshd"
          # Image-residue accounts purged.
          - "'linuxuser:' not in v_passwd"
          - "'\nuser:' not in v_passwd"

- name: Verify nats profile (stacked on gw_node)
  hosts: nats
  become: true
  tasks:
    - name: Assert stacked end state (gw_node lockdown + nats mesh ports)
      ansible.builtin.assert:
        quiet: true
        that:
          # Base gw_node behaviour intact.
          - "'ip6 saddr ::/0 tcp dport 22' not in v_nft"
          - "'DisableForwarding yes' in v_sshd"
          # NATS ports opened on the overlay interface ONLY.
          - "'iifname \"gw-pm\" tcp dport 4222 ct state new accept' in v_nft"
          - "'iifname \"gw-pm\" tcp dport 8222 ct state new accept' in v_nft"
          - "'dport 4222 ct state new accept' not in (v_nft | regex_replace('iifname \"gw-pm\" tcp dport 4222 ct state new accept', ''))"

    - name: Read nats-server.conf
      ansible.builtin.slurp:
        path: /etc/nats-server.conf
      register: verify_nats_conf

    - name: Assert NATS config (overlay bind, JetStream, mutual TLS)
      ansible.builtin.assert:
        quiet: true
        that:
          - "'host: \"::1\"' in c"
          - "'store_dir: \"/var/lib/nats-server/jetstream\"' in c"
          - "'verify:    true' in c"
      vars:
        c: "{{ verify_nats_conf.content | b64decode }}"

    - name: Read the NATS INFO banner (plaintext preamble before TLS)
      ansible.builtin.shell: |
        python3 -c "
        import socket
        s = socket.create_connection(('::1', 14222), timeout=5)
        print(s.recv(4096).decode())"
      register: verify_nats_banner
      changed_when: false

    - name: Assert NATS advertises mTLS and JetStream
      ansible.builtin.assert:
        quiet: true
        that:
          - "'\"tls_required\":true' in verify_nats_banner.stdout"
          - "'\"tls_verify\":true' in verify_nats_banner.stdout"
          - "'\"jetstream\":true' in verify_nats_banner.stdout"

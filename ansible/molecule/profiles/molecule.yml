---
# Profile-level end-to-end test: THREE systemd containers, one per profile.
# Each container joins its profile's inventory group (bastion / dev / gw_node),
# so the real group_vars/<profile>.yml files apply exactly as in fleet mode
# (converge imports ../../site.yml, whose adjacent group_vars/ ansible loads).
# verify asserts the profile-differentiating end state (firewall rules, sshd
# config, account purges, Claude Code).
#
# Run from ansible/:   molecule test -s profiles
# Host-global actions are staged, not run (the *_apply guards below) — in
# particular nftables_apply, since a host-networked container shares the
# host's netns. Per-host ssh_port (inventory host_vars below — INVENTORY
# host_vars outrank the playbook-adjacent group_vars, scenario-local files
# would not) avoids :22 collisions there; ansible_user likewise overrides
# all.yml's pmuser, since molecule connects via docker exec as root.
# greasewood is skipped: heavy and identical across profiles.
role_name_check: 1
driver:
  name: docker
platforms:
  - name: profiles-bastion
    groups: [bastion]
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: profiles-dev
    groups: [dev]
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: profiles-gw-node
    groups: [gw_node]
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  # The service profiles STACK on gw_node — these containers prove composition.
  - name: profiles-nats
    groups: [gw_node, nats]
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: profiles-postgres
    groups: [gw_node, postgres]
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  # Merged: postgres + account co-located, account talks to the LOCAL socket.
  - name: profiles-account
    groups: [gw_node, postgres, account]
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    host_vars:
      profiles-bastion:
        ansible_user: root
        ssh_port: 2201
      profiles-dev:
        ansible_user: root
        ssh_port: 2202
      profiles-gw-node:
        ansible_user: root
        ssh_port: 2203
      profiles-nats:
        ansible_user: root
        ssh_port: 2204
      profiles-postgres:
        ansible_user: root
        ssh_port: 2205
      profiles-account:
        ansible_user: root
        ssh_port: 2206
        # Account test config lives in INVENTORY host_vars (not group_vars.account
        # below) because the repo's playbook-adjacent group_vars/account/vars.yml
        # — with its empty, must-be-filled account_image_tag etc. — outranks
        # inventory group_vars; inventory host_vars outrank both.
        # LIVE run against the offline stand-in (prepare.yml builds it), not the
        # private GHCR image. Port aligned with the firewall rule below.
        account_image_repo: localhost/account-standin
        account_image_tag: test
        account_port: 18766
        nftables_extra_tcp_ports: [18766]
        account_ghcr_user: test-bot
        account_ghcr_token: ghp_testtoken
        # LOCAL database: co-located postgres over the Unix socket (peer auth),
        # no remote DSN. The postgres role provisions the pm role + account db.
        account_db_local: true
        # Distinct postgres TCP port from profiles-postgres so the two servers
        # don't collide under host-net mode (shared loopback in the sandbox; in
        # CI's bridge mode they have separate IPs). Irrelevant to the account
        # app, which reaches this cluster over the Unix socket.
        postgres_port: 15433
        account_voucher_seed: "1111111111111111111111111111111111111111111111111111111111111111"
        account_anon_issuer_key: |
          -----BEGIN PRIVATE KEY-----
          TEST-NOT-A-REAL-KEY
          -----END PRIVATE KEY-----
    group_vars:
      all:
        # Stage host-global actions instead of running them (containers).
        nftables_apply: false
        sysctl_apply: false
        auditd_apply: false
        resolved_apply: false
        timesync_apply: false
        coredump_apply: false
        networkd_apply: false
        module_blacklist_apply: false
        system_upgrade_apply: false
        unattended_upgrades_apply: false
        cloudinit_apply: false
        # Heavy and identical across profiles — skip in this scenario.
        greasewood_enabled: false
        # No mesh in containers: NATS binds the container's own routable
        # address (so the cross-container mTLS check in verify.yml is a real
        # external connection under bridge networking) and prepare.yml
        # generates the TLS material instead of `gw cert-request`.
        nats_listen_addr: "{{ ansible_facts.default_ipv4.address }}"
        nats_cert_manage: false
        nats_port: 14222
        nats_monitor_port: 18222
        postgres_listen_addr: "{{ ansible_facts.default_ipv4.address }}"
        postgres_cert_manage: false
        postgres_port: 15432
        # PGDATA (the production default) doesn't exist at prepare time.
        postgres_tls_dir: /etc/postgres/tls
verifier:
  name: ansible

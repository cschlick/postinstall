---
# Set first, so the install task below already honours it.
- name: Disable apt Recommends and Suggests
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (packages role)
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
    dest: /etc/apt/apt.conf.d/99norecommends
    owner: root
    group: root
    mode: "0644"
  when: packages_no_recommends

- name: Install the base package set
  ansible.builtin.apt:
    name: "{{ packages_install }}"
    state: present
    update_cache: true
  when: packages_install | length > 0

# uv isn't packaged for Debian; install it globally via pipx (just installed
# above) from PyPI. --global + PIPX_GLOBAL_BIN_DIR put `uv`/`uvx` in /usr/local/bin
# for every user. Idempotent via the creates guard.
- name: Install uv globally via pipx
  ansible.builtin.command:
    cmd: pipx install --global uv
    creates: /usr/local/bin/uv
  environment:
    PIPX_GLOBAL_BIN_DIR: /usr/local/bin
  when: packages_uv | bool

# state: absent + purge tolerates entries that aren't installed (apt acts only
# on the ones present), mirroring the script's one-at-a-time purge.
- name: Purge unwanted packages
  ansible.builtin.apt:
    name: "{{ packages_remove }}"
    state: absent
    purge: true
  when: packages_remove | length > 0

- name: Autoremove orphaned dependencies
  ansible.builtin.apt:
    autoremove: true
    purge: true

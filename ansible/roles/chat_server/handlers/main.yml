---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restart the quadlet-generated unit. daemon_reload first so a changed
# chat.container is regenerated before the restart picks it up. Guarded on
# chat_deploy_run so a config-only staging run (molecule render-only) doesn't try
# to start an unpulled image.
- name: Restart chat server
  ansible.builtin.systemd_service:
    name: chat.service
    state: restarted
    daemon_reload: true
  when: chat_deploy_run | default(true)

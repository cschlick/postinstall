---
# Accounts to ensure exist (idempotent: created if missing, left untouched if
# already present). pmuser is the admin/automation account this playbook
# connects as and that the ssh + group_prune roles configure, so it must exist
# before them — this role runs early in site.yml for that reason.
accounts_present:
  - name: pmuser
    groups: [sudo]
    shell: /bin/bash
    create_home: true
    generate_ssh_key: true
    nopasswd_sudo: true
    # Emergency CONSOLE password for pmuser (SSH password auth is off, so it's
    # only usable at the Vultr web console / serial). pmuser_password_hash is a
    # sha512crypt hash set by set-emergency-password.sh; unset => omit => no
    # password. 'always' (not on_create) so it applies to the ALREADY-EXISTING
    # pmuser and is re-asserted idempotently each run.
    password: "{{ pmuser_password_hash | default(omit) }}"
    update_password: always

# Accounts to FULLY purge if present: the user plus its home directory, mail
# spool and (via userdel) its now-unused primary group. Any processes the user
# is running are killed first so the removal can't be blocked or leave orphans.
accounts_purge:
  - linuxuser

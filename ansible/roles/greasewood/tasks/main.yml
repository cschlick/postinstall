---
- name: Install greasewood system dependencies
  ansible.builtin.apt:
    name:
      - python3-venv
      - wireguard-tools
    state: present
    update_cache: false

- name: Create greasewood virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ greasewood_venv }}
    creates: "{{ greasewood_venv }}/bin/python"

# --force-reinstall always refetches the latest git HEAD (greasewood ships from
# HEAD, not versioned releases, so --upgrade would miss same-version code
# changes). The pip run therefore always executes; the CHANGED report is based
# on the installed version before/after, so a re-apply of the same HEAD is a
# no-op to Ansible (and stays idempotent).
- name: Read installed greasewood version
  ansible.builtin.command: "{{ greasewood_venv }}/bin/pip show greasewood"
  register: greasewood_ver_before
  changed_when: false
  failed_when: false

- name: Install/upgrade greasewood from GitLab
  ansible.builtin.command:
    cmd: "{{ greasewood_venv }}/bin/pip install --force-reinstall git+{{ greasewood_repo }}"
  changed_when: false

- name: Read greasewood version after install
  ansible.builtin.command: "{{ greasewood_venv }}/bin/pip show greasewood"
  register: greasewood_ver_after
  changed_when: false

- name: Report whether greasewood changed
  ansible.builtin.command: /bin/true
  changed_when: (greasewood_ver_before.stdout | default('')) != greasewood_ver_after.stdout

- name: Symlink greasewood into PATH
  ansible.builtin.file:
    src: "{{ greasewood_venv }}/bin/gw"
    dest: "{{ greasewood_bin }}"
    state: link
    owner: root
    group: root

- name: Install greasewood systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - greasewood.service
    - greasewood.path
  notify: Reload systemd

# The path unit is the always-armed watcher: enabling+starting it makes the
# daemon come up on its own as soon as setup-hub / join writes the config —
# the operator never runs `gw run` by hand. Opt out with:
#   systemctl disable --now greasewood.path greasewood.service
- name: Enable and start the greasewood config watcher
  ansible.builtin.systemd_service:
    name: greasewood.path
    enabled: true
    state: started
    daemon_reload: true

# Enable (not necessarily start) the daemon so it also comes up at boot once
# configured. Its ConditionPathExists skips it cleanly when unconfigured.
- name: Enable the greasewood daemon for boot
  ansible.builtin.systemd_service:
    name: greasewood.service
    enabled: true

# Join the mesh HERE — in the playbook, before any mesh service (postgres's
# cert-request, etc.) runs later in site.yml. That's why the enrollment token
# flows as an ansible var (greasewood_join_token, set by pmdeploy --gw-token)
# rather than a post-apply step: gw is installed just above, so a single apply
# does install -> join -> mesh-service in the right order.
- name: Check whether this node is already on the mesh
  ansible.builtin.command: "{{ greasewood_bin }} status"
  register: greasewood_status
  changed_when: false
  failed_when: false
  when: greasewood_join_token | default('') | length > 0

- name: Join the mesh with the enrollment token
  ansible.builtin.command: "{{ greasewood_bin }} join {{ greasewood_join_token }}"
  when:
    - greasewood_join_token | default('') | length > 0
    - greasewood_status.rc | default(1) != 0
  changed_when: true

# Wait for the overlay to come up so a mesh service later in the play can reach
# the anchor's control plane (cert-request). gw creates a gw-<name> interface.
- name: Wait for a mesh interface to appear
  ansible.builtin.command: "{{ greasewood_bin }} status"
  register: greasewood_joined
  until: greasewood_joined.rc == 0
  retries: 20
  delay: 3
  changed_when: false
  failed_when: false
  when: greasewood_join_token | default('') | length > 0

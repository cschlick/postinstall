---
ssh_port: 22
ssh_permit_root_login: "no"
# Listen on IPv4 as well as IPv6 (open profile; pair with nftables_ssh_ipv4
# so the firewall lets IPv4 through too). Default: IPv6-only.
ssh_listen_ipv4: false
# Password auth turns OFF automatically once at least one key is present in
# ssh_authorized_keys; until then it stays ON so you can't be locked out. Set
# this explicitly to "yes" or "no" to override the automatic behaviour.
ssh_password_authentication: "{{ 'no' if ssh_authorized_keys | length > 0 else 'yes' }}"
ssh_allow_users: []                  # e.g. ["deploy"]; empty -> no AllowUsers line
ssh_required_rsa_size: 3072
ssh_drop_ecdsa_hostkey: true
ssh_disable_cloudinit_pwauth: true   # when passwords are off, set cloud-init ssh_pwauth: false

# Public keys to install. Each value is one key string OR a list of key strings:
#   { deploy: "ssh-ed25519 AAAA... comment" }
#   { deploy: ["ssh-ed25519 AAAA... old", "ssh-ed25519 BBBB... new"] }
ssh_authorized_keys: {}

# When true, each listed user's authorized_keys is made EXACTLY the listed
# key(s) — anything else is removed. This is what enables key ROTATION: replace
# a user's key here and re-run with this on to drop the old key. Default false
# (additive — routine runs never remove a key by surprise); turn it on only for
# a deliberate rotation, e.g. -e ssh_authorized_keys_exclusive=true.
ssh_authorized_keys_exclusive: false

# Set to true on jump/bastion hosts. Enables local TCP forwarding scoped to the
# SSH port only (PermitOpen *:{{ ssh_port }}) so the host can serve ProxyJump
# (ssh -J / -W) but nothing else; drops the DisableForwarding + PermitOpen none
# lockdown. Agent forwarding stays off regardless (keys never leave the client).
ssh_allow_proxy_jump: false

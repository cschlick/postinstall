---
# roles/seed — a demo-world seeder, run as a pinned GHCR container via a podman
# quadlet. The seeder container (pm-seed) is NOT auto-started directly; instead an
# enabled trigger unit (pm-seed-autostart) waits for the mesh overlay and fires it
# once on boot (see tasks + pm-seed-autostart.service.j2). The manual path
# (`systemctl start pm-seed`) still works. Stacks on gw_node (needs the overlay + a
# mesh client cert). Secrets come from ansible/vault-seed.yml; this role never
# carries a secret value.
# Mirrors roles/chat_server; runtime contract: postmodern-server/SEED_DEPLOY_ANSIBLE_SPEC.md.

# --- image ---
seed_image_repo: ghcr.io/postmodern-you/postmodern-seed
seed_image_tag: ""                    # REQUIRED (e.g. "v1.4.0" or "latest")
seed_image: "{{ seed_image_repo }}:{{ seed_image_tag }}"
seed_pull_always: false               # true for a mutable tag (:latest)

# --- GHCR pull secret (PRIVATE package) ---
seed_ghcr_registry: ghcr.io
seed_ghcr_user: ""                    # GitHub user/bot the read:packages token belongs to
seed_authfile: /etc/containers/pm-ghcr-auth.json

# --- run user / paths ---
seed_uid: 10001
seed_gid: 10001
seed_env_file: /etc/postmodern/seed.env
seed_quadlet: /etc/containers/systemd/pm-seed.container

# --- target planes (mesh names; ws:// is fine — the overlay encrypts the hop) ---
seed_chat_ws_url: ""                  # REQUIRED e.g. ws://chat01.pm.internal:8765
seed_account_ws_url: ""               # REQUIRED e.g. ws://accounts01.pm.internal:8766

# --- chat DB (REQUIRED — the seeder provisions boards by direct SQL) ---
# Mesh host → the mTLS DSN is built automatically against the mesh_client cert.
# Same shape/formula as chat_server's chat_db_url_effective.
seed_chat_db_host: ""                 # e.g. db01.pm.internal (mesh mTLS, auto DSN)
seed_chat_db_name: chat               # the CHAT db (not account)
seed_chat_db_role: pm
seed_chat_db_port: 5432
mesh_client_tls_dir: /etc/pki/pm      # where the mesh_client cert lands
seed_chat_db_url: ""                  # override with a full DSN for a managed DB
seed_chat_db_url_effective: >-
  {{ ('postgresql://' ~ seed_chat_db_role ~ '@' ~ seed_chat_db_host ~ ':' ~ (seed_chat_db_port | string) ~ '/' ~ seed_chat_db_name
      ~ '?sslmode=verify-full&sslrootcert=' ~ mesh_client_tls_dir ~ '/ca.crt'
      ~ '&sslcert=' ~ mesh_client_tls_dir ~ '/client.crt&sslkey=' ~ mesh_client_tls_dir ~ '/client.key')
     if seed_chat_db_host | length > 0
     else seed_chat_db_url }}

# --- seeding knobs ---
seed_small: false                     # false → SEED_SMALL=0 = the full scale world (auto-seed default).
                                      # true → the fast/small preset (good for a manual smoke run).
# Optional SEED_* size overrides rendered verbatim into seed.env (e.g. a much
# larger world): {SEED_BOARDS: 30, SEED_POSTS: 60, SEED_CROWD: 400, ...}. Scale by
# WIDTH (rooms/boards/posts/users); keep any single room's events well under the
# fold ceiling (~12k). Empty = the built-in scale defaults.
seed_env_extra: {}
# seed_chat_bot_claim_secret, seed_pw come from the vault (see vault-seed.yml.example).

# ACCOUNT_DB_URL intentionally UNSET — no irl badges (the accounts repo is not in
# the image). Everything else seeds fully. Do NOT add ACCOUNT_DB_URL here.

# --- auto-seed on boot ---
# Enable a trigger unit that, on boot, waits for the greasewood overlay interface
# then seeds ONCE. Set false to keep it purely manual (systemctl start pm-seed).
seed_autostart: true
seed_autostart_delay: 180             # seconds to settle after the overlay is up, before seeding
seed_mesh_iface_prefix: "gw-"         # the greasewood overlay interface name prefix to wait for
seed_iface_wait_secs: 600             # give up waiting for a gw-* interface after this long
# Run at most ONCE per node: the world accumulates, so re-seeding every reboot
# would pile on duplicates. A marker file under seed_state_dir guards it. Set false
# to seed on EVERY boot (rarely what you want).
seed_autostart_once: true
seed_state_dir: /var/lib/pm-seed

# Stage config only (render + daemon-reload; the trigger unit — not pm-seed — is
# what gets enabled). Also pulls the image so the first run is instant.
seed_deploy_run: true

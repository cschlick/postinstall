---
# Install Claude Code with Anthropic's native installer (a self-contained
# binary — no Node.js, which the packages role would purge anyway). The
# installer is idempotent and updating: re-running it fetches the latest
# stable and replaces ~/.local/bin/claude if newer. changed-ness is reported
# by comparing the version before and after, so routine applies stay green.
- name: Read installed Claude Code version
  ansible.builtin.command: "/home/{{ claude_code_user }}/.local/bin/claude --version"
  register: claude_code_pre
  changed_when: false
  failed_when: false
  become_user: "{{ claude_code_user }}"

- name: Install/update Claude Code (native installer)
  ansible.builtin.shell: set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  become_user: "{{ claude_code_user }}"
  changed_when: false

- name: Read Claude Code version after install
  ansible.builtin.command: "/home/{{ claude_code_user }}/.local/bin/claude --version"
  register: claude_code_post
  changed_when: false
  become_user: "{{ claude_code_user }}"

- name: Report whether Claude Code was installed or updated
  ansible.builtin.command: /bin/true
  changed_when: (claude_code_pre.stdout | default('')) != claude_code_post.stdout

# The installer puts the binary in ~/.local/bin (on pmuser's PATH via
# ~/.profile); a system-wide symlink makes it reachable from any context.
- name: Symlink claude into PATH
  ansible.builtin.file:
    src: "/home/{{ claude_code_user }}/.local/bin/claude"
    dest: /usr/local/bin/claude
    state: link
    owner: root
    group: root

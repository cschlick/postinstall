---
# Image is pre-built from roles/ssh/molecule/default/Dockerfile
# (tag: molecule-trixie-systemd):
#   docker build -t molecule-trixie-systemd ../../../ssh/molecule/default
# Needs: pip install molecule "molecule-plugins[docker]" ansible; plus docker.
# auditd is NOT exercised live here — the kernel audit subsystem is host-global,
# so converge sets auditd_apply=false and only the rendered files are verified.
role_name_check: 1
driver:
  name: docker
platforms:
  - name: auditd-trixie
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    # Make the role under test resolvable (it lives at ../.. = roles/auditd).
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible

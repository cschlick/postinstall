---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Stop the auditd package's postinst from starting the daemon. The Linux
    # audit subsystem is host-global (not namespaced), so a container auditd
    # would fight the host's and/or load rules into the host kernel. policy-rc.d
    # returning 101 makes invoke-rc.d skip the start during dpkg configure.
    - name: Install a policy-rc.d shim that blocks service auto-start
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exit 101
        dest: /usr/sbin/policy-rc.d
        owner: root
        group: root
        mode: "0755"

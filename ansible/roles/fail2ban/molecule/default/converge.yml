---
- name: Converge
  hosts: all
  become: true
  vars:
    # fail2ban needs a real journal + nftables to run; don't enable/start it in
    # the container. Just prove jail.local renders. Exercise a non-default
    # ignoreip to confirm the list is templated.
    fail2ban_apply: false
    fail2ban_ignoreip:
      - 127.0.0.1/8
      - ::1
      - 192.168.0.0/24
  roles:
    - role: fail2ban

---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # fail2ban auto-starts on install, but a container has no journal/nftables
    # for it to bind to. policy-rc.d returning 101 makes invoke-rc.d skip the
    # start during dpkg configure.
    - name: Install a policy-rc.d shim that blocks service auto-start
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exit 101
        dest: /usr/sbin/policy-rc.d
        owner: root
        group: root
        mode: "0755"

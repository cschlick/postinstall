---
# fail2ban — bans hosts that repeatedly fail SSH auth, adding a persistent,
# cross-connection IP ban on top of sshd's per-connection MaxAuthTries and
# per-source penalties. Not a port — new section.

# Read auth events from the systemd journal: under journald-only logging this
# host has no /var/log/auth.log for the default 'auto' backend to tail.
fail2ban_backend: systemd

# Ban policy.
fail2ban_bantime: 1h        # how long a banned IP stays blocked
fail2ban_findtime: 10m      # window over which failures are counted
fail2ban_maxretry: 5        # failures within findtime before a ban

# Never ban these (space-joined into ignoreip). Keep loopback; ADD YOUR ADMIN
# SUBNET so a mistyped password can't lock you out of your own box.
fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1

# Port the [sshd] jail watches (match the sshd Port / nftables_ssh_port).
fail2ban_ssh_port: ssh

# Ban via nftables — this host's firewall is nftables, not iptables. fail2ban
# manages its own table, coexisting with the inet filter ruleset.
fail2ban_banaction: nftables-multiport
fail2ban_banaction_allports: nftables-allports

# When false, write jail.local but DON'T enable/start the service. fail2ban
# needs a real journal + nftables to run, so the molecule scenario sets this
# false.
fail2ban_apply: true

---
# Postgres listens ONLY on this address — the node's mesh overlay address,
# discovered exactly like the nats role does (first gw-* interface that isn't
# the enrollment door, link-locals rejected). The firewall opening comes from
# nftables_mesh_tcp_ports in group_vars/postgres.yml, NOT from binding alone.
# Override per-host for multi-mesh boxes or tests.
postgres_mesh_iface: "{{ ansible_facts.interfaces | select('match', '^gw-') | reject('equalto', 'gw-door') | first }}"
postgres_listen_addr: "{{ (ansible_facts[postgres_mesh_iface | replace('-', '_')].ipv6 | rejectattr('address', 'match', '^fe80') | first).address }}"

postgres_port: 5432
# Debian 13 (trixie) ships PostgreSQL 17; config lives under
# /etc/postgresql/<version>/main.
postgres_version: "17"
# Where `gw cert-request --profile postgres` places server.key/server.crt/
# root.crt — greasewood's shipped profile uses the Debian/PG cluster data dir
# (the PostgreSQL-conventional location). Must match the greasewood profile;
# tests override it (PGDATA doesn't exist before the package is installed).
postgres_tls_dir: "/var/lib/postgresql/{{ postgres_version }}/main"

# Obtain + auto-renew the server cert from the mesh CA via
# `gw cert-request --profile postgres` (registers renewal + a reload hook —
# postgres reloads its certs on SIGHUP). Tests set this false and pre-place
# their own certs at postgres_tls_dir.
postgres_cert_manage: true

# Databases to provision for REMOTE consumers (login role + owned database),
# e.g. an account/chat server on another mesh node connecting over mTLS. General
# mechanism — a list of {name, role}; add more as new planes need databases:
#   postgres_databases:
#     - { name: account, role: pm }
# (The co-located account case is handled separately by account_db_local, which
# provisions the same over the local socket.)
postgres_databases: []

# Socket-only mode: listen on the Unix socket ONLY — no TCP, no mesh address,
# no TLS, no certs. For a single-host box where the only consumer is a
# co-located app (e.g. account with account_db_local) reaching it over the
# socket with peer auth. Needs no mesh, so an account box can stack on a
# non-mesh base (bastion/dev). Overrides the mesh/TLS config below.
postgres_socket_only: false

---
# PostgreSQL bound to the mesh overlay only, mutual TLS via the mesh CA —
# same design as the nats role: possession of a mesh-CA client cert IS the
# credential (pg_hba: hostssl + trust clientcert=verify-ca; no plain-TCP
# path exists at all).
- name: Install postgresql
  ansible.builtin.apt:
    name: postgresql
    state: present
    update_cache: true

# One-time issuance; the gw daemon then auto-renews at ~half-TTL and reloads
# postgres itself (certs reload on SIGHUP). Needs the anchor's control plane
# (51902) reachable over the mesh.
- name: Request the server certificate from the mesh CA
  ansible.builtin.command:
    cmd: gw cert-request --profile postgres
    creates: "{{ postgres_tls_dir }}/server.crt"
  when: postgres_cert_manage

# Postgres refuses a key it can't own-and-protect. gw places these correctly
# on real hosts; normalizing here also covers test-provisioned certs.
- name: Enforce TLS material ownership
  ansible.builtin.file:
    path: "{{ postgres_tls_dir }}/{{ item.name }}"
    owner: postgres
    group: postgres
    mode: "{{ item.mode }}"
  loop:
    - {name: server.key, mode: "0600"}
    - {name: server.crt, mode: "0644"}
    - {name: root.crt, mode: "0644"}
  loop_control:
    label: "{{ item.name }}"

# Debian's postgresql.conf includes conf.d — the package's stock config stays
# untouched. The package postinst starts the cluster with that stock config
# (localhost, no TLS), hence the restart handler rather than a bare start.
- name: Deploy the mesh/TLS configuration drop-in
  ansible.builtin.template:
    src: 99-mesh.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/conf.d/99-mesh.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Deploy pg_hba.conf (mTLS-only access)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Enable and start postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started

# --- local database for a co-located account server ---------------------------
# When the account profile stacks on THIS host with account_db_local, provision
# the login role + database it connects to over the Unix socket. Peer auth (the
# existing `local all all peer` hba line) maps the pm OS user -> the pm role, so
# no password/TLS is needed for the loopback socket. Raw psql keeps this free of
# a community.postgresql dependency; each step is guarded to stay idempotent.
- name: Wait for postgres to accept local connections
  ansible.builtin.command: pg_isready
  become_user: postgres
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: account_db_local | default(false)

- name: Create the account login role
  ansible.builtin.command:
    cmd: >-
      psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ account_db_role }}'"
  become_user: postgres
  register: pg_role_check
  changed_when: false
  when: account_db_local | default(false)

- name: Create the account login role (if missing)
  ansible.builtin.command:
    cmd: psql -c "CREATE ROLE {{ account_db_role }} LOGIN"
  become_user: postgres
  changed_when: true
  when:
    - account_db_local | default(false)
    - pg_role_check.stdout | default('') != '1'

- name: Check the account database exists
  ansible.builtin.command:
    cmd: >-
      psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ account_db_name }}'"
  become_user: postgres
  register: pg_db_check
  changed_when: false
  when: account_db_local | default(false)

- name: Create the account database owned by the account role (if missing)
  ansible.builtin.command:
    cmd: createdb -O {{ account_db_role }} {{ account_db_name }}
  become_user: postgres
  changed_when: true
  when:
    - account_db_local | default(false)
    - pg_db_check.stdout | default('') != '1'

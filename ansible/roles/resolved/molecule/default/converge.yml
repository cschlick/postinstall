---
- name: Converge
  hosts: all
  become: true
  vars:
    # resolv.conf swap + service restarts are live-network ops; don't run them.
    resolved_apply: false
    # Exercise the routing-domains template path.
    resolved_routing_domains: ["~corp.example"]
    resolved_dns: ["10.0.0.1"]
  roles:
    - role: resolved

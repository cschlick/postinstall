---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read root's shadow entry
      ansible.builtin.getent:
        database: shadow
        key: root

    - name: Assert root's password field is exactly '!' (locked, no hash)
      ansible.builtin.assert:
        quiet: true
        that:
          # [0] is the password field. Must be '!' — locked, with no usable
          # hash behind it. Not empty (sulogin treats that as free entry).
          - (ansible_facts.getent_shadow['root'][0] | default('')) == '!'
        fail_msg: "root password field is '{{ ansible_facts.getent_shadow['root'][0] | default('<missing>') }}', expected '!'"

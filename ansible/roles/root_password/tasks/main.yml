---
# Lock the root password: the password (2nd) field of root's /etc/shadow entry
# must be exactly '!' — not a hash, and not EMPTY. An empty field is "no
# password" (passwd -d semantics): our PAM stack has no nullok so normal
# console/su/ssh paths reject it, but sulogin and other recovery paths treat
# "no password" as free entry, which a locked ('!') field never is.
#
# passwd --lock prepends '!' to whatever is in the field, so on a host where
# the field was already emptied it becomes exactly '!'. If a hash is present
# it becomes '!<hash>' — also locked; we then normalise to plain '!' so no
# usable hash lingers in the file.
- name: Read root's shadow entry
  ansible.builtin.getent:
    database: shadow
    key: root

- name: Lock the root password (shadow field becomes '!')
  ansible.builtin.user:
    name: root
    password: "!"
  when: (ansible_facts.getent_shadow['root'][0] | default('')) != '!'

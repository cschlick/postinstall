---
- name: Verify
  hosts: all
  become: true
  tasks:
    # With system_upgrade_apply=false only the cache refresh runs; prove it
    # populated the apt lists (i.e. the role's update_cache step worked).
    - name: Find apt list files
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns: "*Packages*"
      register: apt_lists

    - name: Assert the apt cache was refreshed
      ansible.builtin.assert:
        quiet: true
        that:
          - apt_lists.matched > 0

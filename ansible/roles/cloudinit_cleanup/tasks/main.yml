---
# 1. Strip stale 'options ipv6 ... disable=1' modprobe lines.
- name: Find modprobe.d config files
  ansible.builtin.find:
    paths: /etc/modprobe.d
    patterns: "*.conf"
  register: cloudinit_modprobe

- name: Remove stale 'options ipv6 ... disable=1' lines
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*options\s+ipv6\b.*\bdisable=1\b'
    state: absent
  loop: "{{ cloudinit_modprobe.files }}"
  loop_control:
    label: "{{ item.path }}"

# 2. Remove cloud-init's sshd drop-in (it can re-assert PasswordAuthentication).
#    The ssh role's 00-hardening.conf already wins, but deleting this stops it
#    re-asserting outright.
- name: Remove cloud-init's sshd drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  register: cloudinit_sshd_dropin

- name: Validate the sshd config after removing the drop-in
  ansible.builtin.command: sshd -t
  register: cloudinit_sshd_t
  changed_when: false
  failed_when: false
  when:
    - cloudinit_apply
    - cloudinit_sshd_dropin.changed

- name: Reload ssh so the removal takes effect
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when:
    - cloudinit_apply
    - cloudinit_sshd_dropin.changed
    - cloudinit_sshd_t.rc | default(1) == 0

- name: Warn if sshd validation failed (ssh was NOT reloaded)
  ansible.builtin.debug:
    msg: >-
      sshd -t failed after removing 50-cloud-init.conf; ssh was NOT reloaded.
      Check the config before relying on it.
  when:
    - cloudinit_apply
    - cloudinit_sshd_dropin.changed
    - cloudinit_sshd_t.rc | default(0) != 0

# 3. Kill the Vultr image's cloud-init log reader. It runs
#    `less /var/log/cloud-init.log` as root on a TTY — less's shell escape
#    (!sh) makes that an unauthenticated root shell for anyone with console
#    access. Provisioning info is long since read; mask it permanently.
- name: Check whether cloud-init-log-reader.service exists
  ansible.builtin.command: systemctl cat cloud-init-log-reader.service
  register: cloudinit_log_reader
  changed_when: false
  failed_when: false

- name: Stop, disable and mask cloud-init-log-reader.service
  ansible.builtin.systemd_service:
    name: cloud-init-log-reader.service
    state: stopped
    enabled: false
    masked: true
  when: cloudinit_log_reader.rc == 0

# 4. Remove root's authorized_keys (cloud-init installs the Vultr account key
#    there). PermitRootLogin no + AllowUsers pmuser make it unreachable today,
#    but unreachable keys have a way of becoming reachable after a refactor.
- name: Remove root's authorized_keys
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent

# 5. Keep cloud-init coherent with the purged default user, then optionally
#    stop it running on future boots.
- name: Stat /etc/cloud
  ansible.builtin.stat:
    path: /etc/cloud
  register: cloudinit_dir

# The base image's default_user is 'linuxuser' (purged by the accounts role),
# which makes ssh-authkey-fingerprints (and any other default_user consumer)
# fail with getpwnam KeyError and pin cloud-init's status at 'error'. A
# cloud.cfg.d drop-in overrides just the name so it resolves to a real account.
- name: Point cloud-init's default user at a surviving account
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-default-user.cfg
    content: |
      # Managed by Ansible (roles/cloudinit_cleanup).
      # default_user 'linuxuser' is purged by the accounts role; point cloud-init
      # at {{ cloudinit_default_user }} so its modules don't fail on a missing user.
      system_info:
        default_user:
          name: {{ cloudinit_default_user }}
    owner: root
    group: root
    mode: "0644"
  when:
    - cloudinit_dir.stat.exists
    - cloudinit_dir.stat.isdir

# 6. Clear the recorded boot-time error without waiting for a reboot. On a
#    fresh bootstrap the accounts role purges linuxuser WHILE cloud-init's
#    final stage is still running (apply.sh is executed by the startup
#    script, i.e. inside that stage), so ssh-authkey-fingerprints — which
#    runs AFTER the startup script, in the same stage — records a KeyError
#    that sits in status.json (and the MOTD) until cloud-init runs again.
#    Re-running the final stage rewrites status.json clean: per-instance
#    modules (including the failed one, whose semaphore persists) are
#    skipped, and anything that does re-run now resolves the drop-in's
#    default user. Detached via systemd-run because during a bootstrap we
#    ARE inside the final stage — the repair must wait for the current run
#    to finish (status --wait), not re-enter it.
#
#    Trigger on either ordering: the error is already recorded ('linuxuser'
#    in the status output — post-boot manual apply), or cloud-init is still
#    running (mid-bootstrap: the failure hasn't happened YET — it fires
#    after this apply returns, so schedule the repair preemptively).
- name: Read cloud-init status
  ansible.builtin.command: cloud-init status --long
  register: cloudinit_status
  changed_when: false
  failed_when: false

- name: Schedule a status repair once cloud-init finishes (clears stale error)
  ansible.builtin.command: >-
    systemd-run --unit=cloudinit-status-repair --collect
    bash -c 'cloud-init status --wait >/dev/null 2>&1;
    exec cloud-init modules --mode=final'
  when: >-
    'linuxuser' in (cloudinit_status.stdout | default(''))
    or 'status: running' in (cloudinit_status.stdout | default(''))

- name: Disable cloud-init on future boots
  ansible.builtin.copy:
    dest: /etc/cloud/cloud-init.disabled
    content: ""
    owner: root
    group: root
    mode: "0644"
    force: false
  when:
    - cloudinit_disable
    - cloudinit_dir.stat.exists
    - cloudinit_dir.stat.isdir

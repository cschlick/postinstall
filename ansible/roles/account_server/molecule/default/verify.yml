---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Stat the rendered artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
      register: verify_files
      loop:
        - /etc/containers/systemd/account.container
        - /etc/postmodern/account.env
        - /etc/containers/pm-ghcr-auth.json
        - /etc/pm/anon-issuer-priv.pem

    - name: Assert artifacts exist with locked-down modes
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_files.results[0].stat.exists                       # quadlet
          - verify_files.results[1].stat.exists                       # env
          - verify_files.results[1].stat.mode == '0600'              # env is root-only
          - verify_files.results[2].stat.exists                       # authfile
          - verify_files.results[2].stat.mode == '0600'              # authfile is root-only
          - verify_files.results[3].stat.exists                       # anon key
          - verify_files.results[3].stat.mode == '0600'
          - verify_files.results[3].stat.pw_name == 'pm'             # owned by uid 10001

    - name: Read the quadlet + env for content checks
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: verify_content
      loop:
        - /etc/containers/systemd/account.container
        - /etc/postmodern/account.env

    - name: Assert the quadlet pins the image + uses host net + the authfile
      vars:
        quadlet: "{{ verify_content.results[0].content | b64decode }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - "'Image=ghcr.io/postmodern-you/postmodern-accounts:v0.0.0-test' in quadlet"
          - "'Network=host' in quadlet"
          - "'AuthFile=/etc/containers/pm-ghcr-auth.json' in quadlet"

    - name: Assert the env carries the required runtime config + secret
      vars:
        env: "{{ verify_content.results[1].content | b64decode }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - "'ACCOUNT_ENV=production' in env"
          - "'ACCOUNT_DB_URL=postgresql://' in env"
          - "'VOUCHER_SEED=1111' in env"
          - "'ANON_ISSUER_KEY=/etc/pm/anon-issuer-priv.pem' in env"

    - name: Assert account.service was generated by the quadlet
      ansible.builtin.command: systemctl cat account.service
      changed_when: false

---
# Image is pre-built from roles/ssh/molecule/default/Dockerfile
# (tag: molecule-trixie-systemd):
#   docker build -t molecule-trixie-systemd ../../../ssh/molecule/default
role_name_check: 1
driver:
  name: docker
platforms:
  - name: account-server-trixie
    image: molecule-trixie-systemd
    pre_build_image: true
    network_mode: "${MOLECULE_NETWORK_MODE:-bridge}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible

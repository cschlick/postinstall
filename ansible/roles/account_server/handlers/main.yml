---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restart the quadlet-generated unit. daemon_reload first so a changed
# account.container is regenerated before the restart picks it up.
- name: Restart account server
  ansible.builtin.systemd_service:
    name: account.service
    state: restarted
    daemon_reload: true

---
# NATS listens ONLY on this address — the node's mesh overlay address,
# discovered from the first gw-* interface that isn't the enrollment door
# (greasewood names every mesh interface gw-<name>; ansible munges the dash
# to an underscore in fact keys). Link-locals rejected. The host firewall admits
# the whole overlay (iifname "gw-*" accept); greasewood's grant table + NATS mTLS
# gate who actually reaches it. Override per-host for multi-mesh boxes or tests.
nats_mesh_iface: "{{ ansible_facts.interfaces | select('match', '^gw-') | reject('equalto', 'gw-door') | first }}"
nats_listen_addr: "{{ (ansible_facts[nats_mesh_iface | replace('-', '_')].ipv6 | rejectattr('address', 'match', '^fe80') | first).address }}"

nats_port: 4222
nats_monitor_port: 8222
nats_store_dir: /var/lib/nats-server/jetstream
nats_tls_dir: /etc/nats/tls

# Obtain + auto-renew the server cert from the mesh CA via
# `gw cert-request --profile nats` (registers renewal + reload with the gw
# daemon). Tests set this false and pre-place their own certs at nats_tls_dir.
nats_cert_manage: true

# JetStream limits: unset => nats-server auto-sizes from host resources.
# Set e.g. "1G" to pin instead.
nats_max_mem_store: ""
nats_max_file_store: ""

---
# Generate throwaway TLS material where `gw cert-request` would place the
# mesh CA's (no mesh in the container; converge sets nats_cert_manage false).
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create the TLS directory
      ansible.builtin.file:
        path: /etc/nats/tls
        state: directory
        mode: "0755"

    - name: Generate a test CA and server certificate
      ansible.builtin.shell: |
        set -e
        cd /etc/nats/tls
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
          -keyout ca.key -out ca.crt -days 30 -nodes -subj "/CN=molecule-test-ca"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
          -keyout server.key -out server.csr -nodes -subj "/CN=localhost"
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
          -CAcreateserial -out server.crt -days 30
        chmod 644 server.key server.crt ca.crt
      args:
        creates: /etc/nats/tls/server.crt

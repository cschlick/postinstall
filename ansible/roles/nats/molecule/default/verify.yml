---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check nats-server is active
      ansible.builtin.command: systemctl is-active nats-server
      changed_when: false

    - name: Install the mTLS checker
      ansible.builtin.copy:
        src: nats_mtls_check.py
        dest: /usr/local/bin/nats_mtls_check.py
        mode: "0755"

    # Banner advertises mTLS+JetStream; certless client rejected; CA-signed
    # client completes CONNECT/PING -> PONG.
    - name: Run the mTLS checks
      ansible.builtin.command: >-
        python3 /usr/local/bin/nats_mtls_check.py ::1 14222
        /etc/nats/tls/ca.crt /etc/nats/tls/client.crt /etc/nats/tls/client.key
      changed_when: false

    - name: Check the JetStream store directory ownership
      ansible.builtin.stat:
        path: /var/lib/nats-server/jetstream
      register: verify_store

    - name: Assert store directory belongs to nats
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_store.stat.isdir
          - verify_store.stat.pw_name == 'nats'

---
- name: Harden a headless Debian host
  hosts: all
  become: true
  roles:
    - role: hostname
      tags: [hostname]
    # Must precede ssh (installs pmuser's authorized_keys) and group_prune
    # (prunes pmuser's groups): ensures pmuser exists, purges linuxuser.
    - role: accounts
      tags: [accounts, users]
    - role: system_upgrade
      tags: [system_upgrade, upgrade]
    - role: ssh
      tags: [ssh]
    - role: sysctl
      tags: [sysctl]
    - role: nftables
      tags: [nftables]
    - role: packages
      tags: [packages]
    - role: greasewood
      when: greasewood_enabled | default(true)
      tags: [greasewood]
    # dev profile only (group_vars/dev.yml sets claude_code_enabled: true).
    - role: claude_code
      when: claude_code_enabled | default(false)
      tags: [claude_code, dev]
    # nats profile only (group_vars/nats.yml sets nats_enabled: true; stacks
    # on a base profile). Needs greasewood (above) for the mesh CA cert.
    - role: nats
      when: nats_enabled | default(false)
      tags: [nats]
    # postgres profile only (group_vars/postgres.yml; stacks like nats).
    - role: postgres
      when: postgres_enabled | default(false)
      tags: [postgres]
    # account profile only (group_vars/account/; stacks like nats/postgres).
    # The account plane runs as a GHCR container via a podman quadlet — an
    # application workload, unlike the native mesh infra above.
    - role: account_server
      when: account_server_enabled | default(false)
      tags: [account_server]
    # chat profile only (group_vars/chat.yml; stacks like account). The chat plane
    # runs as a GHCR container via a podman quadlet — backbone: NATS + Postgres + R2.
    - role: chat_server
      when: chat_server_enabled | default(false)
      tags: [chat_server]
    # seed profile only (group_vars/seed.yml; stacks on gw_node). A one-shot
    # demo-world seeder run as a GHCR container via a podman quadlet (operator
    # triggers it with `systemctl start pm-seed`).
    - role: seed
      when: seed_enabled | default(false)
      tags: [seed]
    # flutter profile only (group_vars/flutter.yml; stacks on gw_node). The web
    # client (static Flutter build via nginx) as a GHCR container; public :8080.
    - role: flutter
      when: flutter_server_enabled | default(false)
      tags: [flutter]
    - role: auditd
      tags: [auditd]
    - role: pwquality
      tags: [pwquality]
    - role: pam
      tags: [pam]
    # Locks root's shadow password field to '!' (no password login path).
    - role: root_password
      tags: [root_password, accounts]
    - role: group_prune
      tags: [group_prune]
    - role: networkd
      tags: [networkd]
    - role: resolved
      tags: [resolved]
    - role: coredump
      tags: [coredump]
    - role: mounts
      tags: [mounts]
    - role: unattended_upgrades
      tags: [unattended_upgrades, upgrades]
    - role: timesync
      tags: [timesync]
    - role: module_blacklist
      tags: [module_blacklist, modules]
    - role: disable_mdns
      tags: [disable_mdns, mdns]
    - role: disable_cups
      tags: [disable_cups, cups]
    - role: motd
      tags: [motd]
    # --- Vultr image build (only when image_build=true; IMAGE_BUILD=1 apply.sh) ---
    - role: cloud_init
      when: image_build | default(false)
      tags: [cloud_init, image]
    # Cloud-image cleanup: removes cloud-init's sshd drop-in, strips stale ipv6.
    - role: cloudinit_cleanup
      tags: [cloudinit_cleanup, cloudinit]
    # image_generalize MUST stay last — it wipes host keys / machine-id /
    # cloud-init state, leaving the box ready to snapshot.
    - role: image_generalize
      when: image_build | default(false)
      tags: [image_generalize, image]
    # The accounts role (above) ensures pmuser exists and purges linuxuser; the
    # root_password role locks root's shadow password field.
    # Still intentionally NOT ported (interactive / per-host provisioning, not
    # headless hardening): user passwords, dotfiles, WireGuard, NFS mounts.
    #
    # Run a subset with:  ansible-playbook site.yml --tags ssh,sysctl
    # Skip the heavy one-off upgrade with:  ... --skip-tags system_upgrade

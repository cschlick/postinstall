---
# The postgres service profile — STACKS on a base profile rather than
# replacing it: put the host in BOTH groups (usually gw_node + postgres) in
# inventory/hosts.yml, or locally POSTGRES=1 GW_NODE=1 bash apply.sh. It only
# adds postgres concerns; SSH exposure still comes from the base profile.

# Run the postgres role (roles/postgres): bound to the mesh overlay address,
# mutual TLS via the mesh CA (gw cert-request --profile postgres).
postgres_enabled: true

# Postgres (5432) is mesh-only: it binds the overlay address, and the host
# firewall admits the whole overlay (iifname "gw-*" accept) — no per-port rule.
# Reachability is enforced by greasewood's grant table + the mTLS-only pg_hba,
# not the host firewall.

# The postmodern plane databases a DB box provisions for REMOTE mesh consumers
# (each: a login role + an owned, separate database — unlinkability, so account
# and chat never share a db). The shared pm role owns both; a plane connects as
# pm over mTLS. Idempotent — existing dbs/roles are left alone. Override in
# host_vars for a box serving a different set. (A CO-LOCATED plane using
# account_db_local/chat_db_local provisions its own over the local socket.)
postgres_databases:
  - { name: account, role: pm }
  - { name: chat, role: pm }

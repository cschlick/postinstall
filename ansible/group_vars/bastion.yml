---
# The bastion profile — hosts listed under the bastion group in
# inventory/hosts.yml, or locally via BASTION=1 bash apply.sh. It is the ONLY
# profile that enables forwarding (along with dev, which extends it): the
# ungrouped default has public SSH but can't ProxyJump. Put a host in exactly
# ONE of the bastion / dev / gw_node groups.

# SSH open to the public internet.
nftables_ssh_public: true

# Serve as a ProxyJump host: SSH-only local forwarding (ssh -J), agent
# forwarding stays off. See ssh_allow_proxy_jump in roles/ssh/defaults.
ssh_allow_proxy_jump: true

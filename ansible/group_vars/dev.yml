---
# The dev profile — a very open development box: everything the bastion does
# (public SSH + ProxyJump), plus SSH over IPv4 as well as IPv6, password SSH
# login (pmuser's emergency console password; faillock and PerSourcePenalties
# still throttle guessing), Claude Code installed and kept current on every
# apply, and NO account purging (a dev box may be a pre-existing machine whose
# users should survive). Hosts listed under the dev group in
# inventory/hosts.yml, or locally via DEV=1 bash apply.sh. Put a host in
# exactly ONE of the bastion / dev / gw_node groups.

# SSH open to the public internet — over IPv4 as well as IPv6 (the other
# profiles are IPv6-only): sshd listens on 0.0.0.0 and the firewall accepts.
nftables_ssh_public: true
nftables_ssh_ipv4: true
ssh_listen_ipv4: true

# Keep SSH password authentication ON (pmuser + emergency console password).
ssh_password_authentication: "yes"

# Serve as a ProxyJump host: SSH-only local forwarding (ssh -J), agent
# forwarding stays off.
ssh_allow_proxy_jump: true

# Install/update Claude Code (roles/claude_code) for pmuser.
claude_code_enabled: true

# Don't purge any accounts (the other profiles remove linuxuser and user).
accounts_purge: []

---
# The account service profile — STACKS on a base profile (like nats/postgres):
# the host sits in BOTH groups (usually gw_node + account) in the deploy repo's
# rendered inventory (postmodern-deploy; `pmdeploy create --profile gw_node,account`),
# or locally ACCOUNT=1 GW_NODE=1 bash apply.sh. It only adds account-server
# concerns; SSH exposure still comes from the base profile.
#
# Runs the postmodern account plane (roles/account_server) as a pinned GHCR
# container via a podman quadlet. Backend is a REMOTE Postgres (mesh or managed) —
# never the local socket. This file (config, no secrets) auto-loads for hosts
# in the `account` group. SECRETS live in ansible/vault-account.yml (ansible-
# vault; account_ghcr_token, account_voucher_seed, account_anon_issuer_key) —
# OUTSIDE group_vars so molecule/CI never auto-load it; apply.sh loads it
# explicitly with the vault password (ANSIBLE_VAULT_PASSWORD_FILE).

account_server_enabled: true

# --- image tag ----------------------------------------------------------------
# Using the mutable :latest and re-pulling on every apply (restarts only when
# the digest actually changed). For a reproducible tier, pin an immutable
# version tag (e.g. "v0.3.0") and set account_pull_always: false.
account_image_tag: "latest"
account_pull_always: true

# --- GHCR pull (private package) — the matching token is in vault-account.yml ----------
account_ghcr_user: "cschlick"         # the GitHub user/bot whose read:packages token this is

# --- database: LOCAL (co-located postgres) or REMOTE --------------------------
# EASIEST: co-locate the postgres profile on the SAME host and connect over the
# local Unix socket — no DSN, no client certs, no secrets. Stack all three:
#   pmdeploy create db01 --profile gw_node,postgres,account
# and set:
account_db_local: false               # true = local socket (the postgres role provisions the db+role)
#
# REMOTE (account_db_local: false) — point account_db_url at a mesh or managed DB:
#   Managed DB → …?sslmode=verify-full&sslrootcert=/etc/pm/db-ca.crt
#   Self-hosted mesh PG → the DB's gw-* address + client mTLS, and
#     account_db_cert_manage: true (mint the client cert from the mesh CA here).
account_db_url: ""                    # REQUIRED when NOT local, e.g. postgresql://pm@db.mesh:5432/account?sslmode=verify-full&sslrootcert=/etc/pm/db-ca.crt&sslcert=/etc/pm/db-client.crt&sslkey=/etc/pm/db-client.key

# TLS material the DSN references, installed read-only under /etc/pm. For a managed
# DB this is usually just the provider CA; for mesh mTLS, the client cert+key too
# (or set account_db_cert_manage: true to mint them from the mesh CA).
account_db_tls_files: []
#   - { src: files/account/db-ca.crt,     dest: db-ca.crt }
#   - { src: files/account/db-client.crt, dest: db-client.crt }
#   - { src: files/account/db-client.key, dest: db-client.key, mode: "0600" }

# --- firewall: the account server is CLIENT-FACING on :8766 --------------------
# Open it to the public internet (IPv4+IPv6). If you front it with a load balancer
# / TLS proxy instead, drop this and use nftables_mesh_tcp_ports: [8766] so only
# the LB (on the mesh) can reach it.
# NOTE: group_vars lists don't merge — a host that also stacks nats/postgres must
# list every port it needs in a host_vars override.
nftables_extra_tcp_ports: [8766]

# --- billing (Paddle) — optional; leave price id blank to keep billing OFF -------
# When set, the account plane exposes checkout/portal + a webhook receiver. Secrets
# (account_paddle_api_key, account_paddle_webhook_secret) go in ansible/vault-account.yml.
# account_paddle_price_id: "pri_..."
# account_paddle_api_base: "https://api.paddle.com"      # sandbox is the default
# account_paddle_success_url: "https://app.example/paid"
# account_webhook_port: 8787                              # the webhook receiver's own port
# ...and OPEN that webhook port publicly so Paddle can POST (add it above):
#   nftables_extra_tcp_ports: [8766, 8787]

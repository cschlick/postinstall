---
# The imagemod (image-moderation) service profile — STACKS on gw_node: the chat
# plane calls it over the mesh (POST /scan). It LISTENS on :8000 over the overlay
# ONLY (no public exposure), so open that port on the mesh interface. Config, NO
# secrets (the API key + GHCR token live in ansible/vault-imagemod.yml).
imagemod_server_enabled: true

imagemod_image_tag: "latest"
imagemod_pull_always: true
imagemod_ghcr_user: "cschlick"

# firewall: the scan API (:8000) is mesh-only — it binds the overlay address, and
# the host firewall admits the whole overlay (iifname "gw-*" accept), so no
# per-port rule. Which peers may reach it is enforced by greasewood's grant table
# + the Bearer API key, not the host firewall.

# Optional model/perf tuning — defaults live in the image (postmodern-imagemod
# README § Configuration). e.g.:
# imagemod_env_extra:
#   PIPELINE_WORKERS: 2
#   MAX_FILE_BYTES: 10485760

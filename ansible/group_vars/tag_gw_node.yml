---
# Overrides for "gw_node" hosts — Vultr instances tagged "gw_node". The dynamic
# inventory (inventory/vultr.yml) auto-creates the tag_gw_node group from that
# tag, so these apply only to tagged nodes. Every other node keeps the permissive
# default of public SSH, so you can't lock yourself out before a node's mesh is up.
#
# Tag a node "gw_node" only AFTER it is reachable over the gw-mesh overlay.

# Restrict SSH to the gw-mesh overlay interface only — no public SSH.
nftables_ssh_public: false

# No forwarding of any kind. This is already the default (ssh_allow_proxy_jump
# false -> DisableForwarding yes), pinned here so a gw_node stays locked down
# even if the defaults ever loosen.
ssh_allow_proxy_jump: false

---
# The bastion profile — applied to the Vultr instance tagged "bastion" (fleet
# mode) or locally with BASTION=1 bash apply.sh. It is the ONLY profile that
# enables forwarding (along with dev, which extends it): the untagged default
# has public SSH but can't ProxyJump. Tag a node with exactly ONE of
# bastion / dev / gw_node (tag_gw_node would win and lock it down).

# SSH open to the public internet.
nftables_ssh_public: true

# Serve as a ProxyJump host: SSH-only local forwarding (ssh -J), agent
# forwarding stays off. See ssh_allow_proxy_jump in roles/ssh/defaults.
ssh_allow_proxy_jump: true

---
# Defaults for the target(s). Override per-host in host_vars/<name>.yml; keep
# secrets in ansible-vault.

# --- connection (remote fleet) ---
# The hardening allows only pmuser over SSH, so connect as pmuser. Ignored for
# the local run (apply.sh uses -c local). The control machine needs pmuser's
# private key (ssh-agent or ~/.ssh) and passwordless sudo on the targets.
ansible_user: pmuser

# --- ssh role ---
# Add a key here and re-run: the ssh role installs it AND switches password auth
# off automatically. Leave empty and passwords stay on (you can't be locked out).
ssh_authorized_keys:
  pmuser:
    - "sk-ecdsa-sha2-nistp256@openssh.com AAAAInNrLWVjZHNhLXNoYTItbmlzdHAyNTZAb3BlbnNzaC5jb20AAAAIbmlzdHAyNTYAAABBBMNkT0CS8ogoE5SirI4jbaPLEeWA8ux5shGoyd23agRfSeqvR/9JQYzVt3dKXPORwFKL6vC/KIrqeD9k2OGyWM0AAAAEc3NoOg== melvin-enclave"
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICUwH1LPReemNHtkCd9uBkfm/ht1kmtqUPz+acu6yL0N pm-backup-key"
ssh_allow_users: ["pmuser"]   # only this user may log in over SSH (AllowUsers)

# --- group_prune role ---
# Strip a user from peripheral/desktop groups it doesn't need on a headless box
# (never touches sudo or the user's primary group). Drop `netdev` only if the
# user need not manage networking — systemd-networkd runs as root here, so pmuser
# doesn't.
group_prune:
  - user: pmuser
    groups: [cdrom, floppy, audio, dip, video, plugdev, users, netdev]

# --- Vultr image build ---
# false = configure THIS live box (default). true = build a generalized,
# cloud-init-ready image: adds the cloud_init + image_generalize roles. Set via
# `IMAGE_BUILD=1 bash apply.sh`, not edited here.
image_build: false

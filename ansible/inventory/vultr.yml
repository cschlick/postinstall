---
# Vultr dynamic inventory (vultr.cloud.vultr plugin, Vultr v2 API).
# Discovers your running instances from the Vultr API — no hand-maintained host list.
#
# Auth: export VULTR_API_KEY=... before running (NEVER commit the key). The
# plugin reads VULTR_API_KEY from the environment automatically.
# Requires the vultr.cloud collection (see requirements.yml) and python3-requests.
#
# Usage:
#   export VULTR_API_KEY=xxxxxxxx
#   ansible-inventory -i inventory/vultr.yml --graph        # list discovered hosts
#   ansible-playbook  -i inventory/vultr.yml site.yml       # run against the fleet
plugin: vultr.cloud.vultr
# API key: prefer a vaulted var `vultr_api_key` (pass with -e @inventory/vault.yml
# --vault-password-file .vault_pass), else fall back to the VULTR_API_KEY env var.
api_key: "{{ vultr_api_key | default(lookup('env', 'VULTR_API_KEY'), true) }}"

# Reach instances over their public IPv4 (swap to the commented line to prefer IPv6).
compose:
  ansible_host: vultr_main_ip
  # ansible_host: vultr_v6_main_ip or vultr_main_ip

# Auto-create groups by region and by each tag, so you can target subsets with
# --limit (e.g. --limit region_ewr, --limit tag_production).
keyed_groups:
  - key: vultr_region
    prefix: region
    separator: _
  - key: vultr_tags | map('lower') | list
    prefix: tag
    separator: _

# Optional: only manage instances carrying a given tag (uncomment + adjust).
# filters:
#   - '"managed" in vultr_tags'

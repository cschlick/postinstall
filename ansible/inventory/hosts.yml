---
# Static fleet inventory. Group = profile: put each host (IP or hostname)
# under exactly ONE of bastion / dev / gw_node — the matching
# group_vars/<profile>.yml applies automatically. Hosts outside every profile
# group get the default, which equals bastion (public IPv6 SSH + ProxyJump).
#
# Connections are plain SSH as pmuser (set in group_vars/all.yml): the control
# machine needs pmuser's private key; pass -K so become can prompt for
# pmuser's password (sudo is NOPASSWD only for gw).
# gw_nodes are reachable only over the mesh — use their mesh address, and hop
# via the bastion (see the ProxyJump note in group_vars/gw_node.yml).
#
#   ./fleet.sh list     # see what's defined here
#   ./fleet.sh apply --limit gw_node
all:
  children:
    bastion:
      hosts:
        # bastion1:
        #   ansible_host: 203.0.113.10
    dev:
      hosts:
        # dev1:
        #   ansible_host: 203.0.113.20
    gw_node:
      hosts:
        # web01:
        #   ansible_host: fda7:76ff:d1f2:3::15   # mesh address
        # nats01:
        #   ansible_host: fda7:76ff:d1f2:3::16   # also under nats: below
    # Service profile — STACKS on a base profile: list nats hosts here AND in
    # their base group (usually gw_node).
    nats:
      hosts:
        # nats01:
        #   ansible_host: fda7:76ff:d1f2:3::16
